<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类加载器树结构展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        neutral: '#64748b',
                        light: '#f8fafc',
                        dark: '#1e293b'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Consolas', 'monospace']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .tree-line {
                position: relative;
            }
            .tree-line::before {
                content: '';
                position: absolute;
                left: -16px;
                top: 0;
                bottom: 0;
                width: 1px;
                background-color: #cbd5e1;
            }
            .tree-line::after {
                content: '';
                position: absolute;
                left: -16px;
                top: 16px;
                width: 8px;
                height: 1px;
                background-color: #cbd5e1;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: #f1f5f9;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: #94a3b8;
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background: #64748b;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- 头部 -->
        <header class="mb-8">
            <h1 class="text-[clamp(1.8rem,4vw,2.8rem)] font-bold text-dark mb-2 text-center">类加载器树结构</h1>
            <p class="text-neutral text-center mb-6">交互式展示Java应用中的类加载器和已加载的类（按包名分级）</p>
            <div class="flex flex-wrap justify-center gap-4 mb-6">
                <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
                    <h3 class="text-sm uppercase tracking-wider text-neutral mb-1">类加载器数</h3>
                    <p id="loader-count" class="text-2xl font-bold text-primary">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
                    <h3 class="text-sm uppercase tracking-wider text-neutral mb-1">总类数</h3>
                    <p id="class-count" class="text-2xl font-bold text-secondary">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
                    <h3 class="text-sm uppercase tracking-wider text-neutral mb-1">已展开节点</h3>
                    <p id="expanded-count" class="text-2xl font-bold text-purple-600">0</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200 mb-6">
                <div class="flex flex-wrap items-center gap-4">
                    <div class="flex-1">
                        <label for="search-input" class="block text-sm font-medium text-neutral mb-1">搜索类名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral">
                                <i class="fa fa-search"></i>
                            </span>
                            <input 
                                type="text" 
                                id="search-input"
                                placeholder="输入类名或包名关键词搜索..."
                                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                            >
                        </div>
                    </div>
                    <div class="flex gap-2">
                <button 
                    id="refresh-data" 
                    class="px-4 py-2 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 transition-colors flex items-center gap-1"
                >
                    <i class="fa fa-refresh"></i>
                    <span>刷新数据</span>
                </button>
                <button 
                    id="expand-all" 
                    class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors flex items-center gap-1"
                >
                    <i class="fa fa-plus-square-o"></i>
                    <span>全部展开</span>
                </button>
                <button 
                    id="collapse-all" 
                    class="px-4 py-2 bg-gray-200 text-dark rounded-md hover:bg-gray-300 transition-colors flex items-center gap-1"
                >
                    <i class="fa fa-minus-square-o"></i>
                    <span>全部折叠</span>
                </button>
            </div>
                </div>
            </div>
        </header>

        <!-- 主要内容 -->
        <main class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between">
                <h2 class="font-bold text-lg text-dark">类加载器结构（1级）</h2>
                <div class="flex items-center gap-2">
                    <span id="current-path" class="text-sm text-neutral truncate max-w-md">根目录</span>
                    <button 
                        id="back-to-root" 
                        class="text-primary hover:text-primary/80 transition-colors"
                        disabled
                    >
                        <i class="fa fa-home"></i>
                    </button>
                </div>
            </div>
            <div 
                id="tree-container" 
                class="p-4 max-h-[60vh] overflow-auto scrollbar-thin"
            >
                <!-- 树结构将通过JavaScript动态生成 -->
                <div class="flex items-center justify-center min-h-[40vh] text-neutral">
                    <div class="text-center">
                        <i class="fa fa-refresh fa-spin text-4xl mb-4"></i>
                        <p>正在加载类数据...</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部 -->
        <footer class="mt-8 text-center text-neutral text-sm">
            <p>类加载器树结构可视化工具 &copy; 2023</p>
        </footer>
    </div>

    <script>
        // 示例数据，实际应用中会从JSON文件加载
        const sampleData = {
          "jdk.internal.loader.ClassLoaders$AppClassLoader": [
            {"className": "com.alibaba.fastjson2.writer.FieldWriterEnum"},
            {"className": "org.springframework.web.servlet.mvc.method.annotation.ResponseBodyEmitter"},
            {"className": "org.springframework.boot.autoconfigure.web.embedded.TomcatWebServerFactoryCustomizer$$Lambda$696/0x0000000801362408"}
          ],
          "jdk.internal.loader.ClassLoaders$PlatformClassLoader": [
            {"className": "java.sql.DriverManager"},
            {"className": "javax.xml.parsers.DocumentBuilderFactory"}
          ],
          "jdk.internal.loader.ClassLoaders$BootClassLoader": [
            {"className": "java.lang.Object"},
            {"className": "java.lang.String"},
            {"className": "java.lang.Integer"}
          ],
          "org.springframework.boot.loader.LaunchedURLClassLoader": [
            {"className": "com.example.Application"},
            {"className": "com.example.controller.HomeController"},
            {"className": "com.example.service.UserService"}
          ]
        };

        // 全局状态
        let currentData = {};
        let filteredData = {};
        let currentPath = [];
        let expandedNodes = new Set();

        // DOM元素
        const treeContainer = document.getElementById('tree-container');
        const searchInput = document.getElementById('search-input');
        const expandAllBtn = document.getElementById('expand-all');
        const collapseAllBtn = document.getElementById('collapse-all');
        const loaderCountEl = document.getElementById('loader-count');
        const classCountEl = document.getElementById('class-count');
        const expandedCountEl = document.getElementById('expanded-count');
        const currentPathEl = document.getElementById('current-path');
        const backToRootBtn = document.getElementById('back-to-root');

        // 将类名按包名构建层级结构
        function buildPackageHierarchy(classes) {
            const root = {};
            
            classes.forEach(classItem => {
                const className = classItem.className;
                const parts = className.split('.');
                let currentLevel = root;
                
                // 处理包名部分
                for (let i = 0; i < parts.length - 1; i++) {
                    const part = parts[i];
                    if (!currentLevel[part]) {
                        currentLevel[part] = {};
                    }
                    currentLevel = currentLevel[part];
                }
                
                // 处理类名部分
                const classNamePart = parts[parts.length - 1];
                currentLevel[classNamePart] = null; // null 表示这是一个类而不是包
            });
            
            return root;
        }

        // 从API获取数据
        async function fetchData(refresh = false) {
            try {
                // 显示加载状态
                treeContainer.innerHTML = '<div class="flex justify-center items-center py-12"><i class="fa fa-circle-o-notch fa-spin text-2xl text-primary"></i><span class="ml-2">加载中...</span></div>';
                
                // 构建请求URL
                const url = `/api/classes?refresh=${refresh}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('获取数据失败:', error);
                // 如果API请求失败，返回示例数据
                return sampleData;
            }
        }

        // 初始化函数
        async function initialize() {
            try {
                // 默认不刷新，获取数据
                const data = await fetchData(false);
                currentData = data;
                
                // 构建包层次结构
                const processedData = {};
                Object.entries(data).forEach(([loader, classes]) => {
                    processedData[loader] = buildPackageHierarchy(classes);
                });
                
                filteredData = processedData;
                expandedNodes.clear();
                currentPath = [];
                
                renderTree();
                updateStats();
                updateCurrentPath();
            } catch (error) {
                console.error('初始化失败:', error);
                // 如果初始化失败，使用示例数据
                initializeWithSampleData();
            }
        }

        // 使用示例数据初始化（备用方案）
        function initializeWithSampleData() {
            currentData = sampleData;
            
            const processedData = {};
            Object.entries(sampleData).forEach(([loader, classes]) => {
                processedData[loader] = buildPackageHierarchy(classes);
            });
            
            filteredData = processedData;
            expandedNodes.clear();
            currentPath = [];
            
            renderTree();
            updateStats();
            updateCurrentPath();
        }

        // 刷新数据函数
        async function refreshData() {
            const refreshBtn = document.getElementById('refresh-data');
            const originalText = refreshBtn.innerHTML;
            
            try {
                // 显示加载状态
                refreshBtn.innerHTML = '<i class="fa fa-refresh fa-spin mr-1"></i> 刷新中...';
                refreshBtn.disabled = true;
                
                // 带refresh=true参数获取数据
                const data = await fetchData(true);
                currentData = data;
                
                // 重新构建包层次结构
                const processedData = {};
                Object.entries(data).forEach(([loader, classes]) => {
                    processedData[loader] = buildPackageHierarchy(classes);
                });
                
                filteredData = processedData;
                expandedNodes.clear();
                currentPath = [];
                
                renderTree();
                updateStats();
                updateCurrentPath();
                
                // 显示成功提示
                refreshBtn.innerHTML = '<i class="fa fa-check mr-1"></i> 刷新成功';
                setTimeout(() => {
                    refreshBtn.innerHTML = originalText;
                    refreshBtn.disabled = false;
                }, 1500);
            } catch (error) {
                console.error('刷新数据失败:', error);
                // 显示错误提示
                refreshBtn.innerHTML = '<i class="fa fa-times mr-1"></i> 刷新失败';
                setTimeout(() => {
                    refreshBtn.innerHTML = originalText;
                    refreshBtn.disabled = false;
                }, 2000);
            }
        }

        // 计算类的总数
        function countClasses(data) {
            let count = 0;
            
            function countRecursive(obj) {
                Object.values(obj).forEach(value => {
                    if (value === null) {
                        count++;
                    } else if (typeof value === 'object') {
                        countRecursive(value);
                    }
                });
            }
            
            Object.values(data).forEach(loader => {
                if (typeof loader === 'object') {
                    countRecursive(loader);
                }
            });
            
            return count;
        }

        // 更新统计信息
        function updateStats() {
            const totalLoaders = Object.keys(filteredData).length;
            const totalClasses = countClasses(filteredData);
            
            loaderCountEl.textContent = totalLoaders;
            classCountEl.textContent = totalClasses;
            expandedCountEl.textContent = expandedNodes.size;
        }

        // 渲染树结构
        function renderTree() {
            treeContainer.innerHTML = '';
            
            if (Object.keys(filteredData).length === 0) {
                treeContainer.innerHTML = `
                    <div class="flex items-center justify-center min-h-[40vh] text-neutral">
                        <div class="text-center">
                            <i class="fa fa-search text-4xl mb-4"></i>
                            <p>没有找到匹配的类</p>
                            <p class="text-xs mt-2">尝试调整搜索条件</p>
                        </div>
                    </div>
                `;
                return;
            }

            const tree = document.createElement('div');
            tree.className = 'ml-4';
            
            // 只渲染一级类加载器
            Object.entries(filteredData).forEach(([loaderName, packageTree]) => {
                const isExpanded = expandedNodes.has(loaderName);
                
                // 创建加载器节点容器
                const loaderContainer = document.createElement('div');
                loaderContainer.className = 'mb-4 border-l-2 border-primary pl-4 py-1';
                
                // 创建加载器标题行
                const loaderRow = document.createElement('div');
                loaderRow.className = 'flex items-center mb-2';
                
                // 创建展开/折叠按钮
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'w-6 h-6 flex items-center justify-center text-neutral hover:text-primary transition-colors mr-1';
                toggleBtn.innerHTML = isExpanded 
                    ? '<i class="fa fa-minus-square-o"></i>' 
                    : '<i class="fa fa-plus-square-o"></i>';
                toggleBtn.addEventListener('click', () => {
                    if (isExpanded) {
                        expandedNodes.delete(loaderName);
                    } else {
                        expandedNodes.add(loaderName);
                    }
                    renderTree();
                    updateStats();
                });
                loaderRow.appendChild(toggleBtn);

                // 创建加载器图标和文本
                const iconSpan = document.createElement('span');
                iconSpan.className = 'w-6 text-primary';
                iconSpan.innerHTML = '<i class="fa fa-cubes"></i>';
                loaderRow.appendChild(iconSpan);

                // 创建加载器名称
                const textSpan = document.createElement('span');
                textSpan.className = 'font-mono text-sm font-bold hover:bg-gray-100 rounded px-1 py-0.5';
                textSpan.textContent = loaderName;
                loaderRow.appendChild(textSpan);

                // 添加类计数
                const classCount = countClasses({ [loaderName]: packageTree });
                const countSpan = document.createElement('span');
                countSpan.className = 'ml-2 text-xs bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded-full';
                countSpan.textContent = `${classCount}个类`;
                loaderRow.appendChild(countSpan);

                loaderContainer.appendChild(loaderRow);

                // 渲染包层次结构
                if (isExpanded) {
                    const packageContainer = document.createElement('div');
                    packageContainer.className = 'ml-7';
                    
                    // 递归渲染包和类
                    renderPackageTree(packageTree, packageContainer, '');
                    
                    loaderContainer.appendChild(packageContainer);
                }
                
                tree.appendChild(loaderContainer);
            });
            
            treeContainer.appendChild(tree);
        }

        // 递归渲染包和类的层次结构
        function renderPackageTree(packageTree, parentElement, parentPath) {
            // 排序：包（content不为null）排在类（content为null）前面
            const sortedEntries = Object.entries(packageTree).sort((a, b) => {
                const isAPackage = a[1] !== null;
                const isBPackage = b[1] !== null;
                
                // 包排在类前面
                if (isAPackage && !isBPackage) return -1;
                if (!isAPackage && isBPackage) return 1;
                
                // 同类型按名称字母排序
                return a[0].localeCompare(b[0]);
            });
            
            sortedEntries.forEach(([name, content]) => {
                const currentPath = parentPath ? `${parentPath}.${name}` : name;
                const isExpanded = expandedNodes.has(currentPath);
                const isClass = content === null;
                
                // 创建节点行
                const nodeRow = document.createElement('div');
                nodeRow.className = 'flex items-center mb-1 tree-line';
                
                // 创建展开/折叠按钮（只有包才有）
                if (!isClass) {
                    const toggleBtn = document.createElement('button');
                    toggleBtn.className = 'w-6 h-6 flex items-center justify-center text-neutral hover:text-primary transition-colors mr-1';
                    toggleBtn.innerHTML = isExpanded 
                        ? '<i class="fa fa-minus-square-o"></i>' 
                        : '<i class="fa fa-plus-square-o"></i>';
                    toggleBtn.addEventListener('click', () => {
                        if (isExpanded) {
                            expandedNodes.delete(currentPath);
                        } else {
                            expandedNodes.add(currentPath);
                        }
                        renderTree();
                        updateStats();
                    });
                    nodeRow.appendChild(toggleBtn);
                } else {
                    nodeRow.appendChild(document.createElement('div')).className = 'w-6 mr-1';
                }

                // 创建图标
                const iconSpan = document.createElement('span');
                iconSpan.className = 'w-6 text-neutral mr-1';
                iconSpan.innerHTML = isClass 
                    ? '<i class="fa fa-file-code-o text-secondary"></i>' 
                    : '<i class="fa fa-folder text-amber-600"></i>';
                nodeRow.appendChild(iconSpan);

                // 创建名称
                const nameSpan = document.createElement('span');
                nameSpan.className = `font-mono text-sm ${isClass ? 'font-normal' : 'font-semibold'} hover:bg-gray-100 rounded px-1 py-0.5 break-all`;
                nameSpan.textContent = name;
                nodeRow.appendChild(nameSpan);

                // 添加复制按钮（只有类才有）
                if (isClass) {
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'ml-2 opacity-0 hover:opacity-100 transition-opacity text-neutral hover:text-primary';
                    copyBtn.innerHTML = '<i class="fa fa-copy"></i>';
                    copyBtn.title = '复制类名';
                    copyBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        navigator.clipboard.writeText(currentPath);
                        // 显示复制成功提示
                        const originalText = copyBtn.innerHTML;
                        copyBtn.innerHTML = '<i class="fa fa-check"></i>';
                        copyBtn.className = 'ml-2 text-green-500';
                        setTimeout(() => {
                            copyBtn.innerHTML = originalText;
                            copyBtn.className = 'ml-2 opacity-0 hover:opacity-100 transition-opacity text-neutral hover:text-primary';
                        }, 2000);
                    });
                    nodeRow.appendChild(copyBtn);
                }

                parentElement.appendChild(nodeRow);

                // 递归渲染子包/子类
                if (!isClass && isExpanded) {
                    const childrenContainer = document.createElement('div');
                    childrenContainer.className = 'ml-7';
                    renderPackageTree(content, childrenContainer, currentPath);
                    parentElement.appendChild(childrenContainer);
                }
            });
        }

        // 更新当前路径显示
        function updateCurrentPath() {
            const pathText = currentPath.join(' / ') || '根目录';
            currentPathEl.textContent = pathText;
            backToRootBtn.disabled = currentPath.length === 0;
        }

        // 搜索功能
        function search(query) {
            if (!query.trim()) {
                // 重新构建原始数据的包层次结构
                const processedData = {};
                Object.entries(currentData).forEach(([loader, classes]) => {
                    processedData[loader] = buildPackageHierarchy(classes);
                });
                
                filteredData = processedData;
                currentPath = [];
                updateCurrentPath();
                renderTree();
                updateStats();
                return;
            }

            query = query.toLowerCase();
            const result = {};

            // 搜索类名和包名
            function searchInPackageTree(tree, currentPath, resultPath) {
                let found = false;
                
                Object.entries(tree).forEach(([name, content]) => {
                    const itemPath = currentPath ? `${currentPath}.${name}` : name;
                    const resultItemPath = resultPath ? `${resultPath}.${name}` : name;
                    
                    // 检查当前名称或路径是否匹配
                    if (name.toLowerCase().includes(query) || itemPath.toLowerCase().includes(query)) {
                        // 如果是类或者需要包含的包，添加到结果中
                        if (content === null) {
                            // 确保结果路径存在
                            ensurePathExists(result, resultItemPath.split('.'), null);
                            found = true;
                        } else {
                            // 对于匹配的包，添加整个子树
                            ensurePathExists(result, resultItemPath.split('.'), JSON.parse(JSON.stringify(content)));
                            found = true;
                        }
                    } else if (content !== null) {
                        // 递归搜索子树
                        const subResult = {};
                        const subFound = searchInPackageTree(content, itemPath, resultItemPath);
                        if (subFound) {
                            ensurePathExists(result, resultItemPath.split('.'), subResult);
                            found = true;
                        }
                    }
                });
                
                return found;
            }

            // 确保结果对象中路径存在
            function ensurePathExists(obj, pathParts, value) {
                let current = obj;
                for (let i = 0; i < pathParts.length - 1; i++) {
                    const part = pathParts[i];
                    if (!current[part]) {
                        current[part] = {};
                    }
                    current = current[part];
                }
                const lastPart = pathParts[pathParts.length - 1];
                if (value !== undefined) {
                    current[lastPart] = value;
                } else if (current[lastPart] !== null) {
                    current[lastPart] = null;
                }
            }

            // 遍历每个类加载器
            Object.entries(currentData).forEach(([loader, packageTree]) => {
                // 检查加载器名是否匹配
                if (loader.toLowerCase().includes(query)) {
                    result[loader] = JSON.parse(JSON.stringify(filteredData[loader]));
                } else {
                    // 搜索包层次结构
                    const loaderResult = {};
                    const found = searchInPackageTree(filteredData[loader], '', '');
                    if (found) {
                        result[loader] = loaderResult;
                    }
                }
            });

            filteredData = result;
            currentPath = [];
            updateCurrentPath();
            renderTree();
            updateStats();
        }

        // 展开所有节点
        function expandAll() {
            expandedNodes.clear();
            
            // 展开所有类加载器
            Object.keys(filteredData).forEach(loader => {
                expandedNodes.add(loader);
                
                // 递归展开所有包
                function expandRecursive(packageTree, parentPath) {
                    Object.entries(packageTree).forEach(([name, content]) => {
                        if (content !== null) {
                            const currentPath = parentPath ? `${parentPath}.${name}` : name;
                            expandedNodes.add(currentPath);
                            expandRecursive(content, currentPath);
                        }
                    });
                }
                
                expandRecursive(filteredData[loader], '');
            });
            
            renderTree();
            updateStats();
        }

        // 折叠所有节点
        function collapseAll() {
            expandedNodes.clear();
            renderTree();
            updateStats();
        }

        // 返回根目录
        function backToRoot() {
            // 重新构建原始数据的包层次结构
            const processedData = {};
            Object.entries(currentData).forEach(([loader, classes]) => {
                processedData[loader] = buildPackageHierarchy(classes);
            });
            
            filteredData = processedData;
            currentPath = [];
            updateCurrentPath();
            renderTree();
            updateStats();
        }

        // 事件监听器
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            // 添加防抖
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(() => {
                search(query);
            }, 300);
        });

        expandAllBtn.addEventListener('click', expandAll);
        collapseAllBtn.addEventListener('click', collapseAll);
        backToRootBtn.addEventListener('click', backToRoot);
        document.getElementById('refresh-data').addEventListener('click', refreshData);

        // 初始化应用
        initialize();
    </script>
</body>
